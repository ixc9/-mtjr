<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بقالة إبراهيم علي</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 0 auto; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
        input, textarea, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; height: 100px; }
        .submit-btn { background: #27ae60; color: #fff; font-weight: bold; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .submit-btn:hover { background: #219150; }
        .admin-link-btn { display: block; text-align: center; background: #f8f9fa; color: #7f8c8d; border: 1px dashed #bdc3c7; padding: 10px; margin-top: 25px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; }
        .success-msg { background: #e8f8f5; color: #27ae60; padding: 10px; border-radius: 6px; text-align: center; display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏪 بقالة إبراهيم علي</h2>
    <form id="orderForm">
        <label for="itemsText">اكتب طلبك التفصيلي:</label>
        <textarea id="itemsText" placeholder="مثال: 2 حليب طازج، 1 خبز، كرتون ماء..." required></textarea>

        <label for="carModel">نوع / موديل السيارة:</label>
        <input type="text" id="carModel" placeholder="مثال: تويوتا كامري / لاندكروزر" required>

        <label for="carColor">لون السيارة:</label>
        <input type="text" id="carColor" placeholder="مثال: أبيض / أسود" required>

        <button type="submit" class="submit-btn" id="sendBtn">إرسال الطلب</button>
    </form>
    <div id="successMsg" class="success-msg">تم إرسال طلبك بنجاح! سيتم تجهيزه فوراً.</div>

    <a href="admin.html" class="admin-link-btn">🔐 دخول لوحة التحكم (الأدمن)</a>
</div>

<script>
    const FIREBASE_URL = "https://omds-5e64c-default-rtdb.firebaseio.com";

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('sendBtn');
        btn.disabled = true;
        btn.innerText = "جاري الإرسال...";

        const newOrder = {
            details: document.getElementById('itemsText').value,
            carModel: document.getElementById('carModel').value,
            carColor: document.getElementById('carColor').value,
            time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
            status: 'active',
            createdAt: Date.now()
        };

        try {
            const response = await fetch(`${FIREBASE_URL}/orders.json`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(newOrder)
            });

            if (response.ok) {
                document.getElementById('successMsg').style.display = 'block';
                document.getElementById('orderForm').reset();
                setTimeout(() => { document.getElementById('successMsg').style.display = 'none'; }, 4000);
            } else {
                alert('حدث خطأ في الاتصال بقاعدة البيانات.');
            }
        } catch (err) {
            alert('تعذر إرسال الطلب، يرجى التأكد من الاتصال بالإنتزنت.');
        } finally {
            btn.disabled = false;
            btn.innerText = "إرسال الطلب";
        }
    });
</script>

</body>
</html>
