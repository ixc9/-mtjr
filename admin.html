<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - بقالة إبراهيم علي</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .login-box, .dashboard { max-width: 900px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .hidden { display: none; }
        h2, h3 { color: #2c3e50; margin-top: 0; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { background: #2980b9; color: #fff; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1c5980; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: right; }
        th { background: #f8f9fa; }
        .complete-btn { background: #27ae60; color: #fff; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; width: auto; margin: 0; }
        .complete-btn:hover { background: #219150; }
        .badge-archived { background: #e0e0e0; color: #555; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .badge-active { background: #ffeaa7; color: #d63031; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .home-btn { display: inline-block; text-decoration: none; color: #7f8c8d; font-size: 14px; margin-top: 15px; text-align: center; width: 100%; }
        .section-divider { margin: 30px 0; border: 0; border-top: 2px dashed #eee; }
    </style>
</head>
<body>

<div id="loginSection" class="login-box">
    <h2>تسجيل دخول الأدمن</h2>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <p id="errorMsg" style="color: red; display: none; margin-top: 10px;">بيانات الدخول غير صحيحة!</p>
    <a href="index.html" class="home-btn">← العودة لصفحة الطلبات</a>
</div>

<div id="dashboardSection" class="dashboard hidden">
    <h2>📋 الطلبات الواردة (النشطة)</h2>
    <table>
        <thead>
            <tr>
                <th>الوقت</th>
                <th>تفاصيل الطلب</th>
                <th>نوع السيارة</th>
                <th>لون السيارة</th>
                <th>الإجراء</th>
            </tr>
        </thead>
        <tbody id="activeOrdersTable"></tbody>
    </table>

    <hr class="section-divider">

    <h3>📁 أرشيف الطلبات المنفذة</h3>
    <table>
        <thead>
            <tr>
                <th>الوقت</th>
                <th>تفاصيل الطلب</th>
                <th>نوع السيارة</th>
                <th>لون السيارة</th>
                <th>الحالة</th>
            </tr>
        </thead>
        <tbody id="archivedOrdersTable"></tbody>
    </table>

    <a href="index.html" class="home-btn" style="margin-top: 25px;">← العودة لصفحة الطلبات الرئيسية</a>
</div>

<script>
    const FIREBASE_URL = "https://omds-5e64c-default-rtdb.firebaseio.com";

    function login() {
        const userVal = document.getElementById('username').value.trim();
        const passVal = document.getElementById('password').value.trim();

        if (userVal === "1234" && passVal === "99336048") {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('errorMsg').style.display = 'none';
            fetchOrders();
            setInterval(fetchOrders, 4000); // تحديث تلقائي كل 4 ثوانٍ
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    async function fetchOrders() {
        try {
            const res = await fetch(`${FIREBASE_URL}/orders.json`);
            const data = await res.json();
            
            const activeTbody = document.getElementById('activeOrdersTable');
            const archivedTbody = document.getElementById('archivedOrdersTable');
            
            activeTbody.innerHTML = '';
            archivedTbody.innerHTML = '';

            if (!data) {
                activeTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا توجد طلبات جديدة.</td></tr>';
                archivedTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">الأرشيف فارغ.</td></tr>';
                return;
            }

            let hasActive = false;
            let hasArchived = false;

            Object.keys(data).reverse().forEach(key => {
                const order = data[key];
                
                if (order.status === 'active') {
                    hasActive = true;
                    activeTbody.innerHTML += `
                        <tr>
                            <td>${order.time}</td>
                            <td>${order.details}</td>
                            <td>${order.carModel}</td>
                            <td>${order.carColor}</td>
                            <td><button class="complete-btn" onclick="completeOrder('${key}')">تم التنفيذ ✅</button></td>
                        </tr>
                    `;
                } else if (order.status === 'archived') {
                    hasArchived = true;
                    archivedTbody.innerHTML += `
                        <tr>
                            <td>${order.time}</td>
                            <td>${order.details}</td>
                            <td>${order.carModel}</td>
                            <td>${order.carColor}</td>
                            <td><span class="badge-archived">منفذ ومؤرشف</span></td>
                        </tr>
                    `;
                }
            });

            if (!hasActive) activeTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا توجد طلبات نشطة حالياً.</td></tr>';
            if (!hasArchived) archivedTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا توجد طلبات مؤرشفة.</td></tr>';

        } catch (err) {
            console.error('خطأ في جلب البيانات:', err);
        }
    }

    async function completeOrder(orderId) {
        try {
            await fetch(`${FIREBASE_URL}/orders/${orderId}.json`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: 'archived' })
            });
            fetchOrders(); // اعادة التحميل فوراً لنقل الطلب إلى الأرشيف
        } catch (err) {
            alert('حدث خطأ أثناء أرشفة الطلب.');
        }
    }
</script>

</body>
</html>
